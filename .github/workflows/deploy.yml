name: Deploy frontend

# 브랜치별로 배포 대상이 다르다. 이미지를 빌드해 GHCR 에 올리고, 해당 서버에서 client 컨테이너만 교체한다.
#   main    → 운영 서버   (이미지 태그 :latest)
#   develop → 맥미니(테스트) (이미지 태그 :develop, Tailscale 로 SSH 접속)
# (db, backend, nginx 는 건드리지 않는다. compose/nginx 설정은 academy-infra 에서 관리)
#
# 필요한 시크릿
#   운영:   NEXT_PUBLIC_API_URL, SERVER_HOST, SSH_PRIVATE_KEY
#   맥미니: DEV_NEXT_PUBLIC_API_URL, DEV_SERVER_HOST(Tailscale 이름/IP), DEV_SSH_USER, DEV_SSH_PRIVATE_KEY,
#           DEV_INFRA_DIR(맥미니의 academy-infra 경로), TS_OAUTH_CLIENT_ID, TS_OAUTH_SECRET (Tailscale OAuth 클라이언트, 태그 tag:ci)
#   NEXT_PUBLIC_API_URL 은 빌드 시점에 번들에 박히므로 환경마다 따로 빌드한다.
# 서버 선행 조건: academy-infra clone + .env + nginx/ssl(운영만)
#   맥미니는 backend · frontend 만 있는 별도 compose(docker/compose.macmini.yml, ./compose.macmini.sh)를 쓴다 — DB · nginx 는 맥미니에 있는 것 사용
#   이미지 태그는 맥미니 compose 의 기본값이 :develop, 운영 compose 는 :latest 라서 .env 에 이미지 변수를 둘 필요가 없다.

on:
  push:
    branches:
      - main
      - develop
    paths-ignore:
      - '**.md'
      - '.github/ISSUE_TEMPLATE/**'
      - '.github/pull_request_template.md'
  workflow_dispatch:

# 배포가 겹치지 않도록 — 진행 중인 배포는 끝까지 두고 다음 배포를 줄 세운다
# (환경별로 따로 줄 세운다)
concurrency:
  group: deploy-frontend-${{ github.ref_name }}
  cancel-in-progress: false

env:
  # GHCR 이미지 이름은 소문자여야 한다 (조직 이름이 대문자를 포함하므로 고정값으로 쓴다)
  IMAGE: ghcr.io/heungkuk-academy/academy-frontend

jobs:
  # ── 이미지 빌드 ─────────────────────────────────────────────
  # ubuntu-24.04-arm = GitHub ARM 러너. 서버가 ARM 이라 여기서 네이티브로 빌드해야
  # QEMU 에뮬레이션(5~10배 느림)을 피한다. public 레포에서 무료다.
  build:
    name: Build and push image
    # main, develop 외의 브랜치에서 수동 실행해도 배포되지 않도록 막는다
    if: github.ref_name == 'main' || github.ref_name == 'develop'
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/arm64
          push: true
          # NEXT_PUBLIC_* 는 빌드 시점에 번들에 박히므로 여기서 주입해야 한다 (바꾸려면 다시 빌드)
          build-args: |
            NEXT_PUBLIC_API_URL=${{ github.ref_name == 'main' && secrets.NEXT_PUBLIC_API_URL || secrets.DEV_NEXT_PUBLIC_API_URL }}
          tags: |
            ${{ env.IMAGE }}:${{ github.ref_name == 'main' && 'latest' || 'develop' }}
            ${{ env.IMAGE }}:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ── 배포 ────────────────────────────────────────────────────
  deploy:
    name: Deploy to ${{ github.ref_name == 'main' && 'production' || 'mac mini' }}
    needs: build
    runs-on: ubuntu-latest
    steps:
      # develop 은 사설망(맥미니)이라 GitHub 러너를 Tailscale 에 임시로 붙인다 (job 이 끝나면 노드가 사라진다)
      - name: Connect to Tailscale
        if: github.ref_name == 'develop'
        uses: tailscale/github-action@v3
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        env:
          INFRA_DIR: ${{ github.ref_name == 'main' && '/home/ubuntu/academy-infra' || secrets.DEV_INFRA_DIR }}
          # 맥미니는 backend · frontend 만 있는 별도 compose 를 쓴다
          COMPOSE_SH: ${{ github.ref_name == 'main' && './compose.sh' || './compose.macmini.sh' }}
        with:
          host: ${{ github.ref_name == 'main' && secrets.SERVER_HOST || secrets.DEV_SERVER_HOST }}
          username: ${{ github.ref_name == 'main' && 'ubuntu' || secrets.DEV_SSH_USER }}
          key: ${{ github.ref_name == 'main' && secrets.SSH_PRIVATE_KEY || secrets.DEV_SSH_PRIVATE_KEY }}
          envs: INFRA_DIR,COMPOSE_SH
          script: |
            set -e
            # SSH 비대화형 셸은 PATH 가 짧아 맥(Homebrew / Docker Desktop / OrbStack)에서 docker 를 못 찾는다
            export PATH="/opt/homebrew/bin:/usr/local/bin:$HOME/.orbstack/bin:/Applications/Docker.app/Contents/Resources/bin:$PATH"
            cd "$INFRA_DIR"

            # client 만 교체 — 항상 서비스 이름을 지정하고 --no-deps 로 다른 서비스를 건드리지 않는다
            $COMPOSE_SH pull client
            $COMPOSE_SH up -d --no-deps client

            # nginx 는 upstream(frontend) 이름을 시작·reload 때만 해석하므로 컨테이너 재생성 직후 reload 한다
            # (reload 는 기존 연결을 끊지 않고, 설정이 잘못되면 기존 설정을 유지한다.
            #  앱이 늦게 뜨거나 아래 확인이 실패해도 nginx 가 이전 IP 를 쥐고 있지 않도록 확인보다 먼저 한다)
            # (맥미니는 기존 nginx 가 고정 주소로 접속하므로 hka-nginx 가 없다 — 있을 때만 reload)
            if docker ps --format '{{.Names}}' | grep -qx hka-nginx; then docker exec hka-nginx nginx -s reload; fi

            # 기동 확인 — 컨테이너 안에서 3000 포트가 응답할 때까지 대기 (최대 약 60초)
            OK=0
            for i in $(seq 1 20); do
              if docker exec frontend wget -q -O /dev/null http://127.0.0.1:3000/ 2>/dev/null; then
                OK=1
                break
              fi
              sleep 3
            done

            if [ "$OK" != "1" ]; then
              echo "기동 확인 실패: frontend 가 3000 포트에서 응답하지 않습니다."
              $COMPOSE_SH logs --tail=50 client
              exit 1
            fi
            echo "frontend 응답 확인"

            # 안 쓰는 이미지 정리 — 어떤 컨테이너도 쓰지 않고 만든 지 7일 지난 이미지
            # (최근 7일 이미지는 롤백용으로 남김, 오래된 이미지는 GHCR 에서 SHA 태그로 다시 받을 수 있음)
            # 운영 서버에서만 실행한다. 맥미니는 다른 앱의 이미지도 있어서 미사용 이미지를 지우면 안 된다.
            if [ "$COMPOSE_SH" = "./compose.sh" ]; then
              docker image prune -af --filter "until=168h"
            fi
